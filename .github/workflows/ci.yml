name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - stitch-v2-integration

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hyperdoctor_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d hyperdoctor_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hyperdoctor_ci?schema=public
      AUTH_SECRET: ci-only-secret-not-for-production
      AUTH_TRUST_HOST: "true"
      ZARINPAL_SANDBOX: "true"
      ZARINPAL_MERCHANT_ID: "00000000-0000-0000-0000-000000000000"
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - run: npx prisma db push
      - run: npm run test:catalog-smoke
      - run: npm run build
