name: Integration CI

on:
  push:
    branches:
      - integration/final-hyperdoctor
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hyperdoctor_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hyperdoctor_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hyperdoctor_ci
      AUTH_SECRET: integration-ci-only-secret-not-for-production
      AUTH_TRUST_HOST: "true"
      AUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SITE_URL: https://hyperdoctor.ir
      E2E_ADMIN_EMAIL: e2e-admin@hyperdoctor.test
      E2E_ADMIN_PASSWORD: HyperDoctor-E2E-CI-Only-2026!
      ALLOW_LOCAL_UPLOADS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx prisma db push --skip-generate
      - run: npm run lint
      - run: npm run build
      - run: npm install --no-save --package-lock=false @playwright/test@1.63.0
      - run: npm run test:e2e:install
      - run: npm run seed
        env:
          ADMIN_EMAIL: ${{ env.E2E_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ env.E2E_ADMIN_PASSWORD }}
          ADMIN_NAME: E2E Admin
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
