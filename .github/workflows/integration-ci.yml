name: Integration CI

on:
  push:
    branches:
      - integration/final-hyperdoctor
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: file:./ci.db
      AUTH_SECRET: integration-ci-only-secret-not-for-production
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_SITE_URL: https://hyperdoctor.ir
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run build
